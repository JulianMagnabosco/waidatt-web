<div class="min-h-screen flex flex-col">
  <header>
    <nav
      class="bg-celeste text-white p-2 md:p-4 flex flex-wrap md:flex-nowrap justify-center md:justify-between items-center font-bold">
      <a class="w-full md:w-auto flex justify-center" routerLink="/">
        <img src="logotipo.png" alt="Logo" class="h-12">
      </a>
      <div class="w-full md:w-auto flex flex-wrap justify-center md:justify-between items-center transition-colors text-center
      *:rounded-xl *:duration-300 *:hover:text-black *:p-2 *:md:p-4 ">

        <a routerLink="/catalog">CATALOGO</a>
        <a href="/home#contacts">CONTACTO</a>

        @if (userLoggedIn()) {

        <a routerLink="/add">NUEVO</a>

        <div class="not-lg:hidden underline">@{{user()}}</div>

        <a class="bg-red-900 cursor-pointer flex" (click)="logout()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="white" class="size-6">
            <path
              d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z" />
          </svg>
          <span class="not-lg:hidden">CERRAR SESION</span>
        </a>
        }@else {

        <a class="bg-cyan-900" routerLink="/login">INICIAR SESION</a>
        }
      </div>
    </nav>
  </header>

  <main class="grow">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-gray-800 text-white p-8 text-center">
    <p>&copy; 2026 Liquidadora RGW</p>
  </footer>

</div>
