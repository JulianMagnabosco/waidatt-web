<div class="min-h-screen flex flex-col">
  <header>
    <nav class="bg-celeste text-white p-4 flex justify-between items-center font-bold">
      <a routerLink="/">
        <img src="logotipo.png" alt="Logo" class="h-12">
      </a>
      <div class="flex justify-between items-center gap-1 transition-colors text-center
      *:rounded-xl *:duration-300 *:hover:text-black *:p-4 ">
        <a routerLink="/catalog">CATALOGO</a>
        @if (userLoggedIn()) {
          
        <a routerLink="/add">NUEVO PRODUCTO</a>
        <a class="bg-red-900" (click)="logout()">CERRAR SESION</a>
        }@else {
          
        <a class="bg-cyan-900" routerLink="/login">INICIAR SESION</a>
        }
      </div>
    </nav>
  </header>

  <main class="grow">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-gray-800 text-white p-8 text-center">
    <p>&copy; 2026 Liquidadora RGW</p>
  </footer>

</div>
