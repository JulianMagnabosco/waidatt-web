<div class="bg-sky-100 min-h-screen flex flex-col">
  <header>
    <nav class="bg-celeste text-white p-4 flex justify-between items-center font-bold">
      <a routerLink="/">
        <img src="logo.jpg" alt="Logo" class="h-12">
      </a>
      <div class="flex justify-between items-center gap-1 transition-colors text-center
      *:rounded *:duration-300 *:hover:bg-cyan-600 *:hover:text-black *:p-4 ">
        <a class="flex overflow-hidden justify-center flex-wrap" routerLink="/catalog">BUSCAR <img src="search.svg" alt="" srcset=""></a>
        @if (admin()) {
          
        <a routerLink="/add">NUEVO PRODUCTO</a>
        <a class="bg-cyan-900" routerLink="/logout">CERRAR SESION</a>
        }@else {
          
        <a class="bg-cyan-900" routerLink="/login">INICIAR SESION</a>
        }
      </div>
    </nav>
  </header>

  <main class="grow">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-gray-800 text-white p-4 text-center">
    <p>&copy; 2026 Liquidadora RGW</p>
  </footer>

</div>
