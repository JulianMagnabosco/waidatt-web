<div class="mb-4 p-5 flex justify-center ">
   <form action="" class="bg-white shadow-md p-2 rounded-lg w-full max-w-3xl" [formRoot]="searchForm">
    <!-- buscar por texto -->
     <div class="flex gap-2 items-center">
      Buscar: 

     <input class="grow min-w-5 bg-sky-100 p-2 rounded-md" type="text" [formField]="searchForm.name"
      placeholder="Nombre del producto">

      <button type="submit" class="bg-cyan-600 text-white px-4 py-2 rounded-lg
       hover:bg-cyan-700 transition-colors font-bold">Buscar</button>
     </div>

     <!-- categorias -->
     <div class="flex justify-center items-center flex-wrap gap-2 mt-2">
      <span class="text-center max-w-full">
        Tipo:
      <select class="bg-sky-100 p-2 rounded-md capitalize" [formField]="searchForm.product_type">
        <option value="">Todos</option>
        @for (item of productTypes; track $index) {
          <option [value]="item">{{item}}</option>
        }
      </select>
      </span>
      <span class="text-center max-w-full">
        Ordenar por:
      <select class="bg-sky-100 p-2 rounded-md" [formField]="searchForm.ordering">
        <option value="name">Alfabético A-Z</option>
        <option value="-name">Alfabético Z-A</option>
        <option value="price">Precio: Menor a Mayor</option>
        <option value="-price">Precio: Mayor a Menor</option>
      </select>
      </span>
     </div>

   </form>
</div>

<!-- listado -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-10">
  <app-table-products [products]="products()" (addCartEvent)="addCart($event)"></app-table-products>
</div>

<!-- paginado -->
<div class="flex justify-center p-5 mt-10 mb-10 gap-4 font-bold *:disabled:opacity-50">
  <button class="bg-cyan-600 text-white px-4 py-2 rounded-lg enabled:hover:bg-cyan-700 transition-colors"
  (click)="prevPage()" disabled="{{searchForm.page().value() <= 1}}">
    Anterior
  </button>
  <div class="flex items-center gap-2">
    <span class="text-lg text-center">Página {{searchForm.page().value()}}</span>
  </div>
  <button class="bg-cyan-600 text-white px-4 py-2 rounded-lg enabled:hover:bg-cyan-700 transition-colors"
  (click)="nextPage()" disabled="{{!canNextPage()}}">
    Siguiente
  </button>
</div>
