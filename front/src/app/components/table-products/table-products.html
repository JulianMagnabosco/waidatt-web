<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
  @for (item of products(); track $index) {
  <div class="rounded-lg p-4 bg-white shadow-md hover:bg-sky-200 flex flex-col items-center">

    <a class="mb-1 flex flex-col items-center" routerLink="/product/{{item.id}}">
      <img src="{{ item.images?.at(0)?.image || 'not-found.png' }}" alt="{{ item.name }}"
        class="w-full aspect-square object-cover mb-2">
      <h3 class="text-xl">{{ item.name }}</h3>
      <h3 class="text-sm font-bold uppercase p-1 rounded-xl bg-sky-300 w-min">{{ item.product_type }}</h3>
      <p class="text-xl font-bold" [hidden]="item.price<1">${{ item.price }}</p>
    </a>
    
    <a class="w-full font-bold text-center p-2 rounded-2xl bg-sky-500 text-white cursor-pointer hover:text-black hover:bg-sky-300" 
    (click)="addCartEvent.emit(item.id)">
      Añadir al carrito
    </a>
  </div>
  }
</div>
