<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
  @for (item of products(); track $index) {
    <div class="rounded-lg p-4 flex flex-col items-center bg-white shadow-md
    cursor-pointer hover:bg-sky-200" 
    routerLink="/product/{{item.id}}">
      <img src="{{ item.images?.at(0)?.image || 'not-found.png' }}" alt="{{ item.name }}" 
      class="w-full aspect-square object-cover mb-2">
      <h3 class="text-xl">{{ item.name }}</h3>
      <h3 class="text-sm font-bold uppercase p-1 rounded-xl bg-sky-300">{{ item.product_type }}</h3>
      <p class="text-xl font-bold">${{ item.price }}</p>
    </div>
  }
</div>
