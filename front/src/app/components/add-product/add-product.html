<div class="mt-5  flex flex-col items-center">
  <h1 class="text-2xl bold uppercase mb-2 text-center">Nuevo Producto</h1>
  <form action="" [formRoot]="productForm" class="max-w-md w-full p-2 rounded-md bg-sky-100
  *:flex *:items-center *:justify-center *:mb-1 *:gap-1">
    <div>
      <label class="w-1/3 text-end" for="name">Nombre: </label>
      <input class="rounded-md bg-white p-1 w-2/3" type="text" [formField]="productForm.name">
    </div>
    <div>
      <label class="w-1/3 text-end" for="price">Precio: </label>
      <input class="rounded-md bg-white p-1 w-2/3" type="number" [formField]="productForm.price">
    </div>
    <div>
      <label class="w-1/3 text-end" for="type">Tipo: </label>
      <select class="bg-white p-2 rounded-md w-2/3" [formField]="productForm.product_type">
        <option value="indumentaria">Indumentaria</option>
        <option value="calzado">Calzado</option>
        <option value="elementos-seguridad">Elementos de Seguridad</option>
      </select>
    </div>
    <div>
      <label class="w-1/3 text-end" for="description">Descripcion: </label>
      <textarea class="w-2/3 rounded-md bg-white p-1" [formField]="productForm.description"></textarea>
    </div>
    <div class="text-center">
      <button type="submit" class="bg-cyan-700 text-white rounded-md p-2 hover:bg-cyan-500">
      Guardar Nuevo
    </button>
    </div>
  </form>
</div>
