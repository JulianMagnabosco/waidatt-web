<div class="mt-5  flex flex-col items-center">
  <h1 class="text-2xl bold uppercase mb-2 text-center">{{editMode() ? "Editar Producto Nº "+productModel().id:"Nuevo Producto"}}</h1>
  <form action="" [formRoot]="productForm" class="max-w-md w-full p-2 rounded-md bg-sky-100
  *:flex *:items-center *:justify-center *:mb-1 *:gap-1">

    <div>
      <label class="w-1/3 text-end" for="name">Nombre: </label>
      <input class="rounded-md bg-white p-1 w-2/3" type="text" [formField]="productForm.name">
    </div>
    <div>
      <label class="w-1/3 text-end" for="price">Precio: </label>
      <input class="rounded-md bg-white p-1 w-2/3" type="number" [formField]="productForm.price">
      
    </div>
    <div>
      <label class="w-1/3 text-end" for="type">Tipo: </label>
      <select class="bg-white p-2 rounded-md w-2/3 capitalize" [formField]="productForm.product_type">
        
        @for (item of productTypes; track $index) {
        <option [value]="item">{{item}}</option>
        }
      </select>
    </div>

    <div>
      <label class="w-1/3 text-end" for="description">Descripcion: </label>
      <textarea class="w-2/3 rounded-md bg-white p-1" [formField]="productForm.description" rows="5"></textarea>
    </div>

    <div class="text-red-500 flex-col font-bold">
      @for (errorString of productForm().errorSummary(); track $index) {
        <div>&DoubleRightArrow;{{errorString.message}}</div>
      }
    </div>

    <div class="text-center">
      <button type="submit" class="bg-cyan-700 text-white rounded-md p-2 hover:bg-cyan-500">
      Guardar
    </button>
    </div>

    <div class="bg-gray-200 rounded-2xl p-2 text-center">
      !: Si el precio es 0, directamente no se mostrara el precio.
    </div>

    <div class="bg-gray-200 rounded-2xl p-2 text-center">
      !: Las imagenes se pueden agregar LUEGO de guardar el producto
    </div>
  </form>
</div>
